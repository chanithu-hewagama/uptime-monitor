name: Uptime Monitoron:  schedule:    - cron: '*/5 * * * *' # Runs every 5 minutes  workflow_dispatch:permissions:  contents: writejobs:  uptime:    runs-on: ubuntu-latest    steps:      - name: Checkout Repository        uses: actions/checkout@v4      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: '20'      - name: Install Dependencies        run: npm install axios      - name: Run Uptime Check Script        run: node monitor.js      - name: Commit and Push Changes        run: |          git config --global user.name "github-actions[bot]"          git config --global user.email "github-actions[bot]@users.noreply.github.com"          git add history.json          git commit -m "Auto: Update uptime check results [skip ci]" || exit 0          git push